async function fetchDexScreener() {
  try {
    const res = await fetch("https://api.dexscreener.com/latest/dex/search?q=SOL");
    const data = await res.json();
    return (data.pairs || []).filter(p => p.chainId === "solana").slice(0, 50);
  } catch (e) { return []; }
}

function computeFlags(pair) {
  const flags = [];
  const liq = pair.liquidity?.usd || 0;
  const mcap = pair.marketCap || pair.fdv || 0;
  const volH1 = pair.volume?.h1 || 0;
  const ageMs = pair.pairCreatedAt ? Date.now() - pair.pairCreatedAt : null;
  const ageMin = ageMs ? ageMs / 60000 : null;
  if (liq < 3000) flags.push({ severity: "high", title: "Very low liquidity", evidence: "$" + liq.toLocaleString() });
  else if (liq < 8000) flags.push({ severity: "med", title: "Low liquidity", evidence: "$" + liq.toLocaleString() });
  if (mcap > 0 && liq / mcap < 0.04) flags.push({ severity: "med", title: "Thin LP vs MCap", evidence: ((liq/mcap)*100).toFixed(1) + "%" });
  if (ageMin !== null && ageMin < 30 && volH1 < 2000) flags.push({ severity: "med", title: "New + quiet volume", evidence: ageMin.toFixed(0) + "m old" });
  if (ageMin !== null && ageMin < 15) flags.push({ severity: "low", title: "Fresh launch", evidence: ageMin.toFixed(0) + " min" });
  flags.push({ severity: "low", title: "Mint/Freeze unverified", evidence: "Run RPC check" });
  return flags;
}

function rankPair(pair) {
  const liq = pair.liquidity?.usd || 0;
  const vol = pair.volume?.h1 || pair.volume?.m5 || 0;
  const buys = pair.txns?.h1?.buys || 0;
  const sells = pair.txns?.h1?.sells || 0;
  const buyRatio = buys + sells > 0 ? buys / (buys + sells) : 0.5;
  const flags = computeFlags(pair);
  const penalty = flags.reduce((s, f) => s + (f.severity === "high" ? 28 : f.severity === "med" ? 12 : 3), 0);
  const liqS = Math.min(100, Math.log10(liq + 1) * 14);
  const volS = Math.min(100, Math.log10(vol + 1) * 18);
  const flowS = buyRatio * 40 + 30;
  const ageBonus = pair.pairCreatedAt && (Date.now() - pair.pairCreatedAt) < 45 * 60000 ? 15 : 0;
  const score = Math.max(0, Math.round(liqS * 0.28 + volS * 0.32 + flowS * 0.25 + ageBonus - penalty));
  return { pair, score, flags, components: { liq: Math.round(liqS), vol: Math.round(volS), flow: Math.round(flowS), penalty } };
}

function shortAddr(a) {
  if (!a || a.length < 10) return a || "—";
  return a.slice(0, 4) + "…" + a.slice(-4);
}

  useEffect(() => { load(); const t = setInterval(load, 45000); return () => clearInterval(t); }, [load]);

  const ranked = useMemo(() => pairs.map(rankPair).sort((a, b) => b.score - a.score), [pairs]);

        React.createElement("p", { className: "text-xs text-slate-500 mb-3" }, "Live Solana pairs from DexScreener. Early = lower age + rising volume."),

          const p = r.pair;
          const age = p.pairCreatedAt ? Math.round((Date.now() - p.pairCreatedAt) / 60000) : null;
